# ---------------------------------------------
# config.yaml  -  Central configuration file
# ---------------------------------------------

# -- Video I/O --
video:
  source: "input.mp4"
  output: "output_annotated.mp4"
  fps_override: null

# -- Detection --
detection:
  model_path: "yolov8n.pt"
  confidence: 0.40
  iou_threshold: 0.50
  person_class_id: 0

# -- Tracking --
tracking:
  tracker_config: "botsort.yaml"
  persist: true

# -- Counting --
counting:
  enabled: true
  line:
    x1: 0
    y1: 360
    x2: 1280
    y2: 360

# -- Visualization --
visualization:
  box_color: [0, 255, 0]
  id_color:  [0, 0, 255]
  text_scale: 0.7
  text_thickness: 2
  box_thickness: 2
  show_confidence: true
  show_fps: true

# -- Export --
export:
  csv_path:           "tracks.csv"
  summary_path:       "summary.json"
  final_report_csv:   "final_report.csv"
  final_report_json:  "final_report.json"

# -- Accessories --
accessories:
  model_path: "accessory_best.pt"  # trained YOLO model weights for cap/mask/glasses/headphones
  confidence: 0.30                 # detection confidence threshold
  iou_threshold: 0.50              # NMS IoU threshold
  head_fraction: 0.40              # upper fraction of person box used as head region
  vote_window: 30                  # sliding-window size for temporal voting (frames)
  vote_threshold: 0.60             # min positive rate to confirm an accessory

# -- Logging --
logging:
  level: "INFO"
