# ---------------------------------------------
# config.yaml  -  Central configuration file
# ---------------------------------------------

# -- Video I/O --
video:
  source: "input.mp4"
  output: "output_annotated.mp4"
  fps_override: null

# -- Person detection --
# This is the PERSON model and nothing else. It is a pretrained COCO network,
# so it can never supply cap/mask/glasses/headphones -- those come only from
# the custom accessory model configured below. Person detection stays fully
# operational whether or not that accessory model exists.
detection:
  model_path: "yolov8n.pt"         # person_model
  confidence: 0.40
  iou_threshold: 0.50
  person_class_id: 0               # only the COCO 'person' class is tracked

# -- Tracking --
tracking:
  tracker_config: "botsort.yaml"
  persist: true

# -- Counting --
counting:
  enabled: true
  line:
    x1: 0
    y1: 360
    x2: 1280
    y2: 360

# -- Visualization --
visualization:
  box_color: [0, 255, 0]
  id_color:  [0, 0, 255]
  text_scale: 0.7
  text_thickness: 2
  box_thickness: 2
  show_confidence: true
  show_fps: true

# -- Export --
export:
  csv_path:           "tracks.csv"
  summary_path:       "summary.json"
  final_report_csv:   "final_report.csv"
  final_report_json:  "final_report.json"

# -- Accessory detection (cap / mask / glasses / headphones) --
# Requires a CUSTOM trained model. If model_path is absent the accessory
# cards report "offline" and every accessory count stays unavailable; no
# accessory number is ever estimated, guessed, or fabricated.
accessories:
  enabled: true
  model_path: "models/accessory_best.pt"
  confidence: 0.35                 # detection confidence threshold
  imgsz: 960                       # inference size; accessories are small
  iou_threshold: 0.50              # NMS IoU threshold
  head_fraction: 0.40              # upper fraction of person box used as head region
  # Temporal voting thresholds are configured in voting_config.py

  # -- Zero-shot fallback (used when models/accessory_best.pt is missing) --
  # YOLO-World open-vocabulary detection. Real inference, not mock data, but
  # NOT a model trained on this project's classes. The dashboard labels it
  # ZERO-SHOT (EXPERIMENTAL) and never "ACCESSORY AI ACTIVE".
  zero_shot:
    enabled: true
    model_path: "yolov8s-world.pt"
    confidence: 0.18
    imgsz: 960

# -- Mock / sample detections --
# Must stay false for real analysis. When false, no synthetic accessory
# detection is generated anywhere in the pipeline.
use_mock_accessories: false

# -- Logging --
logging:
  level: "INFO"
